name: daily fetch, build, mail

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 TRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch listings
        run: python3 engine/fetch_speedyapply.py

      - name: run tests
        run: python3 -m unittest discover engine/tests

      - name: build site
        run: python3 engine/build_site.py

      - name: send match mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUBSCRIBER_EMAIL: ${{ secrets.SUBSCRIBER_EMAIL }}
        run: python3 engine/send_mail.py

      - name: commit data and site
        run: |
          git config user.name "the engine"
          git config user.email "actions@users.noreply.github.com"
          git add engine/data docs
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "daily: fetch, build, mail state ($(date -u +%F))"
          git push
