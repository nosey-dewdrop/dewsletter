name: daily fetch, build, mail

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 TRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with confirm.yml: both commit engine/data, and two runs
  # racing over the same ledger lose one of them.
  group: mail-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone. S11's simulation replays
      # every committed state of engine/data/jobs.json -- that history IS its
      # input data, and the card fails the phase for a simulation fed with
      # anything invented. At depth 1 the runner sees one snapshot and the
      # simulation has nothing to replay. (The test refused to pass on the
      # shallow clone rather than quietly measuring one day; that is why this
      # was caught here and not in production.)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: fetch listings
        run: python3 engine/fetch_speedyapply.py

      # The seat cap is a trigger, not python. pg_harness spins up a throwaway
      # cluster to prove the advisory lock actually works (without it 20
      # concurrent inserts put 119 people in a 100-seat table). ubuntu-latest
      # ships postgres but leaves it off PATH, so the whole SQL suite was
      # silently not collected: CI ran 357 tests where a clean checkout runs
      # 409, and the 52 missing ones were every seat, RLS and invite test.
      - name: put postgres on PATH
        run: ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"

      - name: run tests
        id: tests
        run: |
          command -v initdb >/dev/null || { echo "initdb missing: the SQL suite would skip"; exit 1; }
          python3 -m unittest discover engine/tests

      - name: build site
        run: python3 engine/build_site.py

      - name: send match mail
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: "dewsletter <news@mail.noseydewdrop.com>"
          SUBSCRIBER_EMAIL: ${{ secrets.SUBSCRIBER_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 engine/send_mail.py

      # RUNS EVEN IF THE MAIL STEP FAILED, and that is the whole point.
      #
      # send_mail writes mail_state.json per subscriber precisely so a run that
      # dies halfway remembers what it already sent (S7). None of that survived:
      # a non-zero exit from the mail step skipped this commit and threw the
      # ledgers away, so the next morning re-sent every listing the failed run
      # had already delivered -- the double-send S7 exists to prevent, rebuilt
      # one layer up. send_mail exits non-zero on a real, expected condition
      # (a quota-halted backlog), so this was not hypothetical.
      #
      # Gated on the TESTS, not on the mail: a corpus that failed its tests must
      # never be pushed. If the tests passed, whatever was written is true and
      # has to be kept. The job still reports failure; it just does not lie
      # about what was sent.
      - name: commit data and site
        if: always() && steps.tests.outcome == 'success'
        run: |
          git config user.name "dewsletter"
          git config user.email "actions@users.noreply.github.com"
          git add engine/data docs
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "daily: fetch, build, mail state ($(date -u +%F))"
          git push
