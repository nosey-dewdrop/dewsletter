name: daily fetch, build, mail

on:
  schedule:
    - cron: "0 6 * * *"   # 09:00 TRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch listings
        run: python3 engine/fetch_speedyapply.py

      # The seat cap is a trigger, not python. pg_harness spins up a throwaway
      # cluster to prove the advisory lock actually works (without it 20
      # concurrent inserts put 119 people in a 100-seat table). ubuntu-latest
      # ships postgres but leaves it off PATH, so the whole SQL suite was
      # silently not collected: CI ran 357 tests where a clean checkout runs
      # 409, and the 52 missing ones were every seat, RLS and invite test.
      - name: put postgres on PATH
        run: ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"

      - name: run tests
        run: |
          command -v initdb >/dev/null || { echo "initdb missing: the SQL suite would skip"; exit 1; }
          python3 -m unittest discover engine/tests

      - name: build site
        run: python3 engine/build_site.py

      - name: send match mail
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: "the engine <news@mail.noseydewdrop.com>"
          SUBSCRIBER_EMAIL: ${{ secrets.SUBSCRIBER_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 engine/send_mail.py

      - name: commit data and site
        run: |
          git config user.name "the engine"
          git config user.email "actions@users.noreply.github.com"
          git add engine/data docs
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "daily: fetch, build, mail state ($(date -u +%F))"
          git push
